# Local services (IMP-105, specification §4.1 and §4.7, IMD-03).
#   db  - PostgreSQL 16 with pgvector (IMP-311, IMD-115) for the backend test suites
#         (TEST_DATABASE_URL); started by make db-up.
#   api - the production API image for the local container smoke (IMP-112, IMP-218). Its env file
#         is optional, so it works on a fresh clone with no apps/api/.env. make db-up starts only
#         db; no service sits behind a profile, so docker compose down stops them all.
#   web - the production web image for the local container smoke (IMP-218). The NEXT_PUBLIC_*
#         values are inlined at build time, so they are build arguments; the defaults are public
#         local values. Start both with: docker compose up --build api web
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_test
    ports:
      - "5432:5432"
    # The test database is blank on every start (tests migrate it per run), so its data lives in
    # memory and no volume is left behind by make db-down.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    env_file:
      - path: apps/api/.env
        required: false
    # Fixed local values: inside the container only the compose database is reachable.
    environment:
      APP_ENV: local
      AI_PROVIDER: MOCK
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/travel_test
      ALLOWED_ORIGINS: http://localhost:3000
      DB_AUTH_STUB: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-local-placeholder-anon-key}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_FEATURES_DISABLED: ${NEXT_PUBLIC_FEATURES_DISABLED:-}
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    ports:
      - "3000:3000"
