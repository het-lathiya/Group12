# End-to-end journey and regression suite (IMP-216, IMP-414, IMP-701; specification §13, E2E-01 to
# E2E-08, TC-369 to TC-376, TC-432). Runs on every push to
# main and by manual dispatch (workflow_dispatch) on each pull request's branch before it is merged;
# there is no nightly or pull_request trigger (IMD-185, which lifts IMD-183's one-E2E limit), so it
# is not one of the six required checks. Dispatched with base_url, only the "staging" job runs,
# against that deployment (IMD-137: only inside a staging window); a push never runs it.
#
# It starts the Supabase CLI local stack, migrates and seeds it, builds and starts the API with
# AI_PROVIDER=MOCK and the web app, and runs the journey and the regression specs; E2E-07 then gets
# its own API on 8001 and web app on 3001 (IMD-33). No provider key exists here. The local
# stack's keys exist only inside this job: they come from `supabase status` and are masked, and they
# die with the stack.
name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging web URL for the staging job; empty runs the local-stack job"
        required: false
        default: ""
      features_disabled:
        description: "Comma-separated switch names for FEATURES_DISABLED and NEXT_PUBLIC_FEATURES_DISABLED (TC-372 floor journey)"
        required: false
        default: ""
      repeat_each:
        description: "Number of repetitions per local-stack test (IMD-203)"
        type: string
        required: false
        default: "1"

permissions:
  contents: read

# The floor run (features_disabled set) and the full run of one branch must not cancel each other.
concurrency:
  group: e2e-${{ github.ref }}-${{ inputs.features_disabled }}
  cancel-in-progress: true

# shell: bash adds pipefail, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  # The CLI version of the local runs; it signs tokens with asymmetric keys, hence the JWKS URL.
  SUPABASE_CLI_VERSION: 2.122.0
  APP_ENV: test
  AI_PROVIDER: MOCK
  DB_AUTH_STUB: "false"
  DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
  ALLOWED_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
  NEXT_PUBLIC_FEATURES_DISABLED: ""

jobs:
  e2e:
    name: e2e
    if: ${{ !inputs.base_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # TC-372: the floor journey switches features off in the API and the web build; a push and an
    # empty input leave both empty (every feature on).
    env:
      FEATURES_DISABLED: ${{ inputs.features_disabled }}
      NEXT_PUBLIC_FEATURES_DISABLED: ${{ inputs.features_disabled }}
      REPEAT_EACH: ${{ inputs.repeat_each || '1' }}
    steps:
      - name: Validate repeat count
        run: '[[ "$REPEAT_EACH" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: make setup ARGS=--with-browsers

      # supabase start prints the keys, before they can be masked.
      - name: Start the local stack
        run: make stack-up > /dev/null

      - name: Export the local stack's values into the job
        run: |
          eval "$(supabase status -o env 2>/dev/null)"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_JWKS_URL=$API_URL/auth/v1/.well-known/jwks.json"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - run: make db-migrate
      - run: make seed

      - name: Start the API with MOCK
        working-directory: apps/api
        run: |
          nohup .venv/bin/uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8000/health

      # The server runs from a copy, so the provider-failure build below can reuse .next.
      - name: Build and start the web app
        working-directory: apps/web
        run: |
          npm run build
          # The standalone output leaves out .next/static and public.
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r .next/standalone "$RUNNER_TEMP/web-3000"
          cd "$RUNNER_TEMP/web-3000"
          PORT=3000 HOSTNAME=0.0.0.0 nohup node server.js > "$RUNNER_TEMP/web.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:3000/

      # One report folder per step: the HTML reporter empties its folder at the start of a run.
      - name: Run the journey
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_HTML_REPORT: playwright-report/journey
        run: make e2e ARGS="journey --repeat-each=$REPEAT_EACH"

      # PD-RUN-070b-1: the map specs (tag @map); they run even when the journey failed.
      - name: Run the map specs
        if: ${{ !cancelled() }}
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_HTML_REPORT: playwright-report/map
        run: make e2e ARGS="map --repeat-each=$REPEAT_EACH"

      # IMP-607 TC-376: regeneration and restoring its pre-regeneration version.
      # Skipped when regeneration or versions is switched off: their routes answer 404 (IMD-11).
      - name: Run itinerary editing and restore
        if: ${{ !cancelled() && !contains(inputs.features_disabled, 'regeneration') && !contains(inputs.features_disabled, 'versions') }}
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_HTML_REPORT: playwright-report/itinerary-edit
        run: make e2e ARGS="itinerary-edit --repeat-each=$REPEAT_EACH"

      # IMP-701: E2E-01 to E2E-06, E2E-08, TC-374 and the @ext switch check (TC-432), at one width:
      # IMD-203 raises the local sign-in limit to 300 for repeated runs. The floor run
      # (features_disabled set) runs only the
      # journey and the map specs, as at SG-6.
      - name: Run the regression specs
        if: ${{ !cancelled() && !inputs.features_disabled }}
        env:
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_HTML_REPORT: playwright-report/regression
        run: make e2e ARGS="auth trip-create generate validate-costs reopen ownership keyboard extensions --project=chromium-1280 --repeat-each=$REPEAT_EACH"

      - name: Run the floor journey with the nine cut-list switches disabled
        if: ${{ !cancelled() && !inputs.features_disabled }}
        working-directory: apps/web
        env:
          FEATURES_DISABLED: versions,trip_management,contingency,budget_alerts,wishlist,alternatives,regeneration,locks,meal_slots
          NEXT_PUBLIC_FEATURES_DISABLED: versions,trip_management,contingency,budget_alerts,wishlist,alternatives,regeneration,locks,meal_slots
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8002/api/v1
          ALLOWED_ORIGINS: http://localhost:3002
          BASE_URL: http://localhost:3002
          PLAYWRIGHT_HTML_REPORT: playwright-report/floor-journey
        run: |
          rm -rf .next/standalone .next/static
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r .next/standalone "$RUNNER_TEMP/web-3002"
          cd "$RUNNER_TEMP/web-3002"
          PORT=3002 HOSTNAME=0.0.0.0 nohup node server.js > "$RUNNER_TEMP/web-3002.log" 2>&1 &
          web_pid=$!
          cd "$GITHUB_WORKSPACE/apps/api"
          nohup .venv/bin/uvicorn app.main:app --port 8002 > "$RUNNER_TEMP/api-8002.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "$web_pid"; wait "$api_pid" "$web_pid" || true' EXIT
          cd "$GITHUB_WORKSPACE"
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8002/health
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:3002/
          make e2e ARGS="journey --project=floor-journey --repeat-each=$REPEAT_EACH"

      # E2E-07, TC-371 (IMD-33): a second web build whose browser calls the API on 8001. Next.js
      # inlines NEXT_PUBLIC_* at build time, so it is its own build, served from its own copy.
      - name: Build and start the provider-failure web app on 3001
        if: ${{ !cancelled() && !inputs.features_disabled }}
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8001/api/v1
        run: |
          # The first build's output was copied to web-3000; start this one clean.
          rm -rf .next/standalone .next/static
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r .next/standalone "$RUNNER_TEMP/web-3001"
          cd "$RUNNER_TEMP/web-3001"
          PORT=3001 HOSTNAME=0.0.0.0 nohup node server.js > "$RUNNER_TEMP/web-3001.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:3001/

      # The MOCK scenario is fixed per API process: the API on 8001 runs once with timeout and once
      # with quota, and the run gets the same MOCK_PROVIDER_SCENARIO to pick its test. BASE_URL
      # only stops Playwright from starting a dev server; the project uses 3001.
      - name: Run provider failure with a timeout
        if: ${{ !cancelled() && !inputs.features_disabled }}
        env:
          MOCK_PROVIDER_SCENARIO: timeout
          ALLOWED_ORIGINS: http://localhost:3001
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_HTML_REPORT: playwright-report/provider-failure-timeout
        run: |
          cd apps/api
          nohup .venv/bin/uvicorn app.main:app --port 8001 > "$RUNNER_TEMP/api-8001-timeout.log" 2>&1 &
          api_pid=$!
          cd "$GITHUB_WORKSPACE"
          # Stopped when the step ends, pass or fail, so the next scenario can take port 8001.
          trap 'kill "$api_pid"; wait "$api_pid" || true' EXIT
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8001/health
          make e2e ARGS="--project=provider-failure --repeat-each=$REPEAT_EACH"

      - name: Run provider failure with quota exhausted
        if: ${{ !cancelled() && !inputs.features_disabled }}
        env:
          MOCK_PROVIDER_SCENARIO: quota
          ALLOWED_ORIGINS: http://localhost:3001
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_HTML_REPORT: playwright-report/provider-failure-quota
        run: |
          cd apps/api
          nohup .venv/bin/uvicorn app.main:app --port 8001 > "$RUNNER_TEMP/api-8001-quota.log" 2>&1 &
          api_pid=$!
          cd "$GITHUB_WORKSPACE"
          # Stopped when the step ends, pass or fail, so the next scenario can take port 8001.
          trap 'kill "$api_pid"; wait "$api_pid" || true' EXIT
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8001/health
          make e2e ARGS="--project=provider-failure --repeat-each=$REPEAT_EACH"

      - name: Upload the Playwright report and the server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/api-8001-*.log
            ${{ runner.temp }}/web-3001.log
            ${{ runner.temp }}/api-8002.log
            ${{ runner.temp }}/web-3002.log
          retention-days: 14

  # TC-370: the same journey against a deployment. It signs in with the pre-created staging account
  # (CI secrets E2E_STAGING_EMAIL and E2E_STAGING_PASSWORD) and deletes that account's trips through
  # the API before and after the run. The deployment's AI_PROVIDER decides MOCK or Gemini.
  staging:
    name: staging
    if: ${{ inputs.base_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # No report upload here: a Playwright trace records typed values, the account password too.
      # One width and one worker: every width would share the one staging account, and one run's
      # trip reset would delete another's trip.
      - name: Run the journey against staging
        env:
          BASE_URL: ${{ inputs.base_url }}
          E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
        run: make e2e ARGS='journey --project=chromium-1280 --workers=1'
