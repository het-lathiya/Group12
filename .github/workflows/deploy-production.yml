# Production deployment (IMP-218; A1 §4.4, §4.5, IMD-102, IMD-103). Run by hand (Kirtan) from a
# release tag through "Run workflow"; never on push or pull request. The deploy job uses the protected
# environment production (required reviewer Kirtan), and its steps are those of deploy-staging.yml:
# API image, release task, API service, web image, web service, smoke test. Production migrations are
# forward only; a rollback deploys the previous tag. The container never migrates on start (IMD-38).
#
# AWS is reached only through the OIDC role; no AWS key is stored, and every value below is a
# repository variable, not a secret. While a variable is missing, the check job prints
# "AWS production not configured (blocked by IMP-801)", the deploy job is skipped and the run is green.
# Names and purposes: docs/secrets.md. The flow and rollback: docs/guides/deployment.md.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

# shell: bash adds pipefail, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"

jobs:
  check:
    name: check-configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - name: Check the repository variables
        id: config
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_API_REPO: ${{ vars.ECR_API_REPO }}
          ECR_WEB_REPO: ${{ vars.ECR_WEB_REPO }}
          ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          ECS_INFRASTRUCTURE_ROLE_ARN: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          AWS_SUBNET_IDS: ${{ vars.AWS_SUBNET_IDS }}
          API_TASKS_SECURITY_GROUP: ${{ vars.API_TASKS_SECURITY_GROUP }}
          PRODUCTION_API_SERVICE_ARN: ${{ vars.PRODUCTION_API_SERVICE_ARN }}
          PRODUCTION_WEB_SERVICE_ARN: ${{ vars.PRODUCTION_WEB_SERVICE_ARN }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_ANON_KEY }}
        # PRODUCTION_FEATURES_DISABLED may be empty (A1 §4.4), so it is not required here.
        run: |
          missing=""
          for name in AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN ECR_API_REPO ECR_WEB_REPO \
            ECS_EXECUTION_ROLE_ARN ECS_INFRASTRUCTURE_ROLE_ARN AWS_SUBNET_IDS API_TASKS_SECURITY_GROUP \
            PRODUCTION_API_SERVICE_ARN PRODUCTION_WEB_SERVICE_ARN PRODUCTION_API_URL PRODUCTION_WEB_ORIGIN \
            PRODUCTION_SUPABASE_URL PRODUCTION_SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::AWS production not configured (blocked by IMP-801)"
            echo "missing variables (names only):$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "AWS production configured"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy-production
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: production
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      ECR_API_REPO: ${{ vars.ECR_API_REPO }}
      ECR_WEB_REPO: ${{ vars.ECR_WEB_REPO }}
      ECS_EXECUTION_ROLE_ARN: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
      ECS_INFRASTRUCTURE_ROLE_ARN: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
      AWS_SUBNET_IDS: ${{ vars.AWS_SUBNET_IDS }}
      API_TASKS_SECURITY_GROUP: ${{ vars.API_TASKS_SECURITY_GROUP }}
      API_SERVICE_ARN: ${{ vars.PRODUCTION_API_SERVICE_ARN }}
      WEB_SERVICE_ARN: ${{ vars.PRODUCTION_WEB_SERVICE_ARN }}
      API_URL: ${{ vars.PRODUCTION_API_URL }}
      PRODUCTION_WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN }}
      PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_ANON_KEY }}
      PRODUCTION_FEATURES_DISABLED: ${{ vars.PRODUCTION_FEATURES_DISABLED }}
      SUPABASE_JWKS_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}/auth/v1/.well-known/jwks.json
    steps:
      # The input is passed through env, never interpolated into the script.
      - name: Check the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "tag '$TAG' is not a release tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tagged commit (it must be on main)
        run: |
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main || { echo "the tag is not on main"; exit 1; }
          {
            echo "DEPLOY_SHA=$sha"
            echo "API_IMAGE=$REGISTRY/$ECR_API_REPO:$sha"
            echo "WEB_IMAGE=$REGISTRY/$ECR_WEB_REPO:$sha"
          } >> "$GITHUB_ENV"
          echo "deploying $sha"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      # The API half of make setup (the web packages are not needed here), for make smoke.
      - name: Install the API toolchain
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -e "apps/api[dev]"

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to the registry
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Write the deploy helpers
        run: |
          cat > "$RUNNER_TEMP/deploy-helpers.sh" <<'HELPERS'
          cluster_of() { # service ARN .../service/<cluster>/<name>
            local path="${1%/*}"
            echo "${path##*/}"
          }

          # envsubst would blank a placeholder without a variable, so that stops the deploy instead.
          check_template() { # template
            local name
            [ -f "$1" ] || { echo "$1 is missing" >&2; return 1; }
            for name in $(grep -oE '\$\{[A-Z0-9_]+\}' "$1" | tr -cd 'A-Z0-9_\n' | sort -u); do
              [ -n "${!name+set}" ] || { echo "$1 needs $name" >&2; return 1; }
            done
          }

          # Sends the full rendered configuration (A1 §4.3) and waits until only the new image is active.
          update_service() { # service ARN, template, image
            local arn="$1" template="$2" active="" attempt
            export IMAGE="$3"
            envsubst < "$template" \
              | jq --arg arn "$arn" 'del(.serviceName, .cluster, .infrastructureRoleArn) + {serviceArn: $arn}' \
              | aws ecs update-express-gateway-service --cli-input-json file:///dev/stdin \
                --query service.serviceArn --output text
            # services-stable alone can return before the rollout has started.
            for attempt in $(seq 1 60); do
              active="$(aws ecs describe-express-gateway-service --service-arn "$arn" \
                --query 'service.activeConfigurations[].primaryContainer.image' --output text)"
              [ "$active" = "$IMAGE" ] && break
              echo "attempt $attempt: active images: $active"
              sleep 15
            done
            [ "$active" = "$IMAGE" ] || { echo "${arn##*/} did not roll out $IMAGE in 15 minutes" >&2; return 1; }
            aws ecs wait services-stable --cluster "$(cluster_of "$arn")" --services "${arn##*/}"
          }
          HELPERS

      # Before anything changes: the release task migrates, and migrations are forward only.
      - name: Check the service templates
        env:
          IMAGE: ${{ env.API_IMAGE }}
        run: |
          . "$RUNNER_TEMP/deploy-helpers.sh"
          check_template "infra/aws/services/api.$DEPLOY_ENV.json.tmpl"
          check_template "infra/aws/services/web.$DEPLOY_ENV.json.tmpl"

      - name: Build and push the API image
        run: |
          docker build --platform linux/amd64 -f apps/api/Dockerfile \
            --build-arg BUILD_VERSION="$DEPLOY_SHA" -t "$API_IMAGE" .
          docker push "$API_IMAGE"

      # run-task cannot change an image, so the task runs a release revision of the service's task
      # definition with the new image. Its environment is the service's current one (A1 §4.5).
      - name: Run the release task
        run: |
          . "$RUNNER_TEMP/deploy-helpers.sh"
          cluster="$(cluster_of "$API_SERVICE_ARN")"
          service_task="$RUNNER_TEMP/service-task.json"
          service="${API_SERVICE_ARN##*/}"
          # Express Mode leaves services[0].taskDefinition null; the PRIMARY deployment holds it.
          task_definition="$(aws ecs describe-services --cluster "$cluster" --services "$service" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)"
          case "$task_definition" in
            arn:*) echo "service task definition: $task_definition" ;;
            *) echo "::error::no PRIMARY deployment task definition for $service in $cluster (got '${task_definition:-empty}')"; exit 1 ;;
          esac
          aws ecs describe-task-definition --task-definition "$task_definition" \
            --query taskDefinition --output json > "$service_task"
          # Keep only what register-task-definition accepts (AWS CLI reference), minus null values.
          release_arn="$(jq --arg family "group12-api-$DEPLOY_ENV-release" --arg image "$API_IMAGE" '
            {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, volumes,
             placementConstraints, requiresCompatibilities, cpu, memory, pidMode, ipcMode,
             proxyConfiguration, inferenceAccelerators, ephemeralStorage, runtimePlatform,
             enableFaultInjection}
            | with_entries(select(.value != null))
            | .family = $family | .containerDefinitions[0].image = $image' "$service_task" \
            | aws ecs register-task-definition --cli-input-json file:///dev/stdin \
              --query taskDefinition.taskDefinitionArn --output text)"
          echo "release revision: $release_arn"

          command='["sh", "scripts/release.sh"]'
          container="$(jq -r '.containerDefinitions[0].name' "$service_task")"
          task_arn="$(aws ecs run-task --cluster "$cluster" --task-definition "$release_arn" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$AWS_SUBNET_IDS],securityGroups=[$API_TASKS_SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --overrides "$(jq -n --arg name "$container" --argjson command "$command" \
              '{containerOverrides: [{name: $name, command: $command}]}')" \
            --query 'tasks[0].taskArn' --output text)"
          case "$task_arn" in
            arn:*) echo "release task: $task_arn" ;;
            *) echo "::error::the release task did not start"; exit 1 ;;
          esac

          # Each wait gives up after 10 minutes; the exit code below decides either way.
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn" \
            || aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn" \
            || echo "::warning::the release task has not stopped after 20 minutes"

          log_group="$(jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-group"]' "$service_task")"
          log_prefix="$(jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"]' "$service_task")"
          sleep 10 # CloudWatch receives the last lines shortly after the task stops.
          # shortcut: one page of log events (1 MB), far more than the script prints; follow nextForwardToken if that changes.
          aws logs get-log-events --log-group-name "$log_group" --start-from-head --output json \
            --log-stream-name "$log_prefix/$container/${task_arn##*/}" | jq -r '.events[].message' \
            || echo "::warning::the release task log could not be read"

          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" \
            --query "tasks[0].containers[?name=='$container'] | [0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            reason="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" \
              --query 'tasks[0].stoppedReason' --output text)"
            echo "::error::release task exit code $exit_code ($reason); no service was updated"
            exit 1
          fi

      - name: Update the API service
        run: |
          . "$RUNNER_TEMP/deploy-helpers.sh"
          update_service "$API_SERVICE_ARN" "infra/aws/services/api.$DEPLOY_ENV.json.tmpl" "$API_IMAGE"

      - name: Wait until the API reports the deployed commit
        run: |
          for attempt in $(seq 1 40); do
            version="$(curl -fsS --max-time 30 "${API_URL%/}/health" | jq -r .version || true)"
            if [ "$version" = "$DEPLOY_SHA" ]; then
              echo "the API runs $DEPLOY_SHA (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: the API reports '${version:-no answer}', waiting for $DEPLOY_SHA"
            sleep 15
          done
          echo "::error::the API did not report $DEPLOY_SHA within 10 minutes"
          exit 1

      - name: Build and push the web image
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$PRODUCTION_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$PRODUCTION_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${API_URL%/}/api/v1" \
            --build-arg NEXT_PUBLIC_FEATURES_DISABLED="$PRODUCTION_FEATURES_DISABLED" \
            --build-arg BUILD_VERSION="$DEPLOY_SHA" -t "$WEB_IMAGE" apps/web
          docker push "$WEB_IMAGE"

      - name: Update the web service
        run: |
          . "$RUNNER_TEMP/deploy-helpers.sh"
          update_service "$WEB_SERVICE_ARN" "infra/aws/services/web.$DEPLOY_ENV.json.tmpl" "$WEB_IMAGE"

      - name: Smoke test and CORS check
        env:
          BUILD_VERSION: ${{ env.DEPLOY_SHA }}
        run: |
          curl -fsS --max-time 30 -o /dev/null "$PRODUCTION_WEB_ORIGIN/"
          make smoke URL="$API_URL" ARGS="--web-origin $PRODUCTION_WEB_ORIGIN"
